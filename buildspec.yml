version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform, tfsec, and checkov"
      - curl -o terraform.zip https://releases.hashicorp.com/terraform/1.15.7/terraform_1.15.7_linux_amd64.zip
      - unzip terraform.zip -d /usr/local/bin
      - curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      - pip install checkov

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/workload" && terraform init -input=false

  build:
    commands:
      - echo "Running terraform plan"
      - cd "$CODEBUILD_SRC_DIR/workload" && terraform plan -out=tfplan.binary -input=false -var="image_tag=$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - echo "Running tfsec scan"
      - cd "$CODEBUILD_SRC_DIR/workload" && tfsec . --format json --out tfsec-report.json || true
      - echo "Running checkov scan"
      - cd "$CODEBUILD_SRC_DIR/workload" && checkov -d . --output json > checkov-report.json || true

artifacts:
  files:
    - workload/tfplan.binary
    - workload/tfsec-report.json
    - workload/checkov-report.json
  discard-paths: no
